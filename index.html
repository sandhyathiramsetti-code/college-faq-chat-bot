<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College FAQ Bot</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f6f8; margin: 0; }
    .container { max-width: 600px; margin: 30px auto; background: #fff;
                 border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08);
                 display: flex; flex-direction: column; height: 80vh; }
    .header { padding: 16px; background: #2563eb; color: #fff;
              border-radius: 12px 12px 0 0; font-weight: 600; }
    .messages { flex: 1; overflow-y: auto; padding: 16px; }
    .msg { margin: 8px 0; padding: 10px 14px; border-radius: 14px;
           max-width: 80%; line-height: 1.4; white-space: pre-wrap; }
    .user { background: #2563eb; color: #fff; margin-left: auto; border-bottom-right-radius: 4px; }
    .bot  { background: #e9eef5; color: #111; margin-right: auto; border-bottom-left-radius: 4px; }
    .input-row { display: flex; padding: 12px; border-top: 1px solid #eee; gap: 8px; }
    input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
    button { padding: 10px 18px; background: #2563eb; color: #fff; border: none;
             border-radius: 8px; cursor: pointer; font-size: 15px; }
    button:disabled { background: #9bb4e8; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">College FAQ Bot</div>
    <div class="messages" id="messages">
      <div class="msg bot">Hi! Ask me anything about the college.</div>
    </div>
    <div class="input-row">
      <input id="input" placeholder="Type your question..." autocomplete="off">
      <button id="send">Send</button>
    </div>
  </div>

  <script>
    const messages = document.getElementById("messages");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");

    // Add a message bubble to the chat
    function addMessage(text, who) {
      const div = document.createElement("div");
      div.className = "msg " + who;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;  // auto-scroll to bottom
      return div;
    }

    async function sendQuestion() {
      const question = input.value.trim();
      if (!question) return;

      addMessage(question, "user");
      input.value = "";
      sendBtn.disabled = true;

      // Show a temporary "thinking..." bubble
      const loading = addMessage("Thinking...", "bot");

      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question })
        });
        const data = await res.json();
        loading.textContent = data.answer || data.error || "No response.";
      } catch (err) {
        loading.textContent = "Could not reach the server.";
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    sendBtn.addEventListener("click", sendQuestion);
    input.addEventListener("keydown", e => { if (e.key === "Enter") sendQuestion(); });
  </script>
</body>
</html>
