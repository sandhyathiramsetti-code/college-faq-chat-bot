<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College FAQ Bot</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, sans-serif;
      background: #f4f6f8;
      margin: 0;
      height: 100vh;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    /* SIDEBAR */

    .sidebar {
      width: 240px;
      background: #202123;
      color: white;
      padding: 12px;
      display: flex;
      flex-direction: column;
    }

    .new-chat {
      width: 100%;
      padding: 12px;
      background: transparent;
      color: white;
      border: 1px solid #565869;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      text-align: left;
      margin-bottom: 15px;
    }

    .new-chat:hover {
      background: #2a2b32;
    }

    .history-title {
      font-size: 12px;
      color: #aaa;
      margin: 10px 5px;
    }

    .chat-list {
      overflow-y: auto;
      flex: 1;
    }

    .chat-item {
      padding: 10px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 14px;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-item:hover {
      background: #2a2b32;
    }

    .chat-item.active {
      background: #343541;
    }

    /* MAIN AREA */

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: white;
      min-width: 0;
    }

    .header {
      padding: 16px 20px;
      border-bottom: 1px solid #eee;
      font-weight: 600;
      font-size: 18px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 25px;
    }

    .msg {
      margin: 12px 0;
      padding: 12px 16px;
      border-radius: 14px;
      max-width: 75%;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user {
      background: #2563eb;
      color: white;
      margin-left: auto;
      border-bottom-right-radius: 4px;
    }

    .bot {
      background: #e9eef5;
      color: #111;
      margin-right: auto;
      border-bottom-left-radius: 4px;
    }

    .chart-box {
      margin: 8px 0 15px 0;
      padding: 15px;
      background: #f8fafc;
      border: 1px solid #ddd;
      border-radius: 10px;
      max-width: 75%;
    }

    /* INPUT */

    .input-area {
      padding: 15px 20px;
      border-top: 1px solid #eee;
      background: white;
    }

    .input-row {
      display: flex;
      gap: 8px;
      max-width: 900px;
      margin: auto;
    }

    input {
      flex: 1;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    .send {
      padding: 10px 20px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
    }

    .send:disabled {
      background: #9bb4e8;
      cursor: not-allowed;
    }

    /* MOBILE */

    @media (max-width: 700px) {
      .sidebar {
        width: 180px;
      }

      .msg,
      .chart-box {
        max-width: 90%;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar">

    <button class="new-chat" id="newChat">
      ＋ New Chat
    </button>

    <div class="history-title">
      CHAT HISTORY
    </div>

    <div class="chat-list" id="chatList"></div>

  </div>


  <!-- MAIN CHAT -->
  <div class="main">

    <div class="header">
      College FAQ Bot
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-area">

      <div class="input-row">

        <input
          id="input"
          placeholder="Ask anything about the college..."
          autocomplete="off"
        >

        <button class="send" id="send">
          Send
        </button>

      </div>

    </div>

  </div>

</div>


<script>

  const messages = document.getElementById("messages");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const newChatBtn = document.getElementById("newChat");
  const chatList = document.getElementById("chatList");


  /*
    CHAT STORAGE

    Each chat looks like:

    {
      id: 1,
      title: "What is the fee?",
      history: [
        {
          question: "...",
          answer: "...",
          chart: {...}
        }
      ]
    }
  */

  let chats = [];

  let currentChatId = null;


  /* CREATE NEW CHAT */

  function createNewChat() {

    const chat = {
      id: Date.now(),
      title: "New Chat",
      history: []
    };

    chats.push(chat);

    currentChatId = chat.id;

    renderChatList();

    renderCurrentChat();

    input.focus();
  }


  /* GET CURRENT CHAT */

  function getCurrentChat() {

    return chats.find(chat => chat.id === currentChatId);

  }


  /* DISPLAY CHAT LIST */

  function renderChatList() {

    chatList.innerHTML = "";

    chats.forEach(chat => {

      const div = document.createElement("div");

      div.className = "chat-item";

      if (chat.id === currentChatId) {
        div.classList.add("active");
      }

      div.textContent = chat.title;

      div.addEventListener("click", () => {

        currentChatId = chat.id;

        renderChatList();

        renderCurrentChat();

      });

      chatList.appendChild(div);

    });

  }


  /* DISPLAY CURRENT CHAT */

  function renderCurrentChat() {

    messages.innerHTML = "";

    const chat = getCurrentChat();

    if (!chat || chat.history.length === 0) {

      addMessage(
        "Hi! Ask me anything about the college.",
        "bot"
      );

      return;
    }


    chat.history.forEach(item => {

      addMessage(item.question, "user");

      addMessage(item.answer, "bot");


      if (item.chart) {

        displayChart(item.chart);

      }

    });

  }


  /* ADD MESSAGE */

  function addMessage(text, who) {

    const div = document.createElement("div");

    div.className = "msg " + who;

    div.textContent = text;

    messages.appendChild(div);

    messages.scrollTop = messages.scrollHeight;

    return div;

  }


  /* DISPLAY CHART */

  function displayChart(chart) {

    const chartDiv = document.createElement("div");

    chartDiv.className = "chart-box";

    chartDiv.innerHTML = `
      <strong>📊 ${chart.type.toUpperCase()} CHART</strong>
      <br><br>

      ${chart.labels.map((label, index) =>
        `${label}: ${chart.values[index]}`
      ).join("<br>")}
    `;

    messages.appendChild(chartDiv);

    messages.scrollTop = messages.scrollHeight;

  }


  /* SEND QUESTION */

  async function sendQuestion() {

    const question = input.value.trim();

    if (!question) return;


    const chat = getCurrentChat();

    if (!chat) {

      createNewChat();

    }


    const currentChat = getCurrentChat();


    /* Add first question as title */

    if (currentChat.history.length === 0) {

      currentChat.title = question;

      renderChatList();

    }


    /* Show user question */

    addMessage(question, "user");

    input.value = "";

    sendBtn.disabled = true;


    /* Thinking message */

    const loading = addMessage(
      "Thinking...",
      "bot"
    );


    try {

      const res = await fetch("/ask", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          question: question,

          history: currentChat.history.map(item => ({
            question: item.question,
            answer: item.answer
          }))

        })

      });


      const data = await res.json();


      const answer =
        data.answer ||
        data.error ||
        "No response.";


      loading.textContent = answer;


      /*
        SAVE THE QUESTION,
        ANSWER AND CHART
      */

      currentChat.history.push({

        question: question,

        answer: answer,

        chart: data.chart || null

      });


      /*
        DISPLAY CHART
      */

      if (data.chart) {

        displayChart(data.chart);

      }


      /*
        UPDATE CHAT TITLE
      */

      renderChatList();


    } catch (err) {

      loading.textContent =
        "Could not reach the server.";

    } finally {

      sendBtn.disabled = false;

      input.focus();

    }

  }


  /* NEW CHAT BUTTON */

  newChatBtn.addEventListener(
    "click",
    createNewChat
  );


  /* SEND BUTTON */

  sendBtn.addEventListener(
    "click",
    sendQuestion
  );


  /* ENTER KEY */

  input.addEventListener(
    "keydown",
    e => {

      if (e.key === "Enter") {

        sendQuestion();

      }

    }
  );


  /*
    START WITH ONE CHAT
  */

  createNewChat();

</script>

</body>
</html>
